name: v4.0 Morphology-Diverse Acquisition Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v40-morphology-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve retired final-holdout lock
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test -f data/final_holdout/champion_freeze_v38.json
          test -f reports/v3_8_final_holdout_summary.json
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          if grep -RE "python[[:space:]].*v38_final_holdout.*\.py" .github/workflows; then
            echo 'ERROR: retired v3.8 holdout evaluator must not be reachable from v4 workflows.' >&2
            exit 1
          fi
          echo 'Retired v3.8 holdout remains locked.'
      - name: Install image audit dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire four pre-existing non-holdout morphology candidates
        run: python scripts/v40_acquire_morphology_candidates.py
      - name: Verify candidate-only evidence boundary
        shell: bash
        run: |
          grep -q '"model_inference_performed": false' reports/v4_0_morphology_candidate_manifest.json
          grep -q '"count": 4' reports/v4_0_morphology_candidate_manifest.json
          test -f reports/v4_0_morphology_contact_sheet.jpg
          ! grep -q 'POS_3437435' reports/v4_0_morphology_candidate_manifest.json
          ! grep -q 'POS_7561805' reports/v4_0_morphology_candidate_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: v40-morphology-candidates
          path: |
            reports/v4_0_morphology_candidate_manifest.json
            reports/v4_0_morphology_contact_sheet.jpg
            reports/v4_0_morphology_candidates/*.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
