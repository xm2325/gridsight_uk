name: v2.3 Online YOLO26 / YOLOE-26

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cpu_finetune_epochs:
        description: "Short CPU YOLO26n fine-tune epochs (not headline performance)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: v23-online-sota-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  YOLO26_WEIGHT: "yolo26n.pt"
  YOLOE26_WEIGHT: "yoloe-26n-seg.pt"

jobs:
  hydrate-and-validate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact frozen UK images from canonical Commons URLs
        run: python scripts/v23_download_frozen_images.py
      - name: Validate frozen five-image / 55-box dataset
        run: python scripts/v23_validate_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: v23-frozen-data
          path: |
            data/images/
            reports/v2_3_frozen_image_download.json
            reports/v2_3_pack_validation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  download-checkpoints:
    needs: hydrate-and-validate-data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download official pretrained checkpoints and hash them
        run: python scripts/v23_download_weights.py
      - uses: actions/upload-artifact@v4
        with:
          name: v23-pretrained-checkpoints
          path: |
            weights/*.pt
            reports/v2_3_online_checkpoint_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  yoloe-zero-shot:
    needs: [hydrate-and-validate-data, download-checkpoints]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v23-frozen-data
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - uses: actions/download-artifact@v4
        with:
          name: v23-pretrained-checkpoints
          path: weights
      - name: Normalize downloaded artifact layout
        shell: bash
        run: |
          if [ -d weights/weights ]; then mv weights/weights/*.pt weights/; fi
          find weights -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Run YOLOE-26n zero-shot text-prompt segmentation on frozen held-out tower
        run: python scripts/v23_yoloe_zero_shot.py
      - uses: actions/upload-artifact@v4
        with:
          name: v23-yoloe-zero-shot
          path: |
            reports/v2_3_yoloe26_zero_shot_POS_2326530.jpg
            reports/v2_3_yoloe26_zero_shot_predictions.json
          if-no-files-found: error
          retention-days: 30

  yolo26-cpu-finetune-smoke:
    needs: [hydrate-and-validate-data, download-checkpoints]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v23-frozen-data
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - uses: actions/download-artifact@v4
        with:
          name: v23-pretrained-checkpoints
          path: weights
      - name: Normalize downloaded artifact layout
        shell: bash
        run: |
          if [ -d weights/weights ]; then mv weights/weights/*.pt weights/; fi
      - name: Short pretrained YOLO26n CPU fine-tune smoke
        env:
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu_finetune_epochs || '3' }}
        run: python scripts/v23_yolo26_cpu_finetune.py --epochs "$EPOCHS" --imgsz 640
      - uses: actions/upload-artifact@v4
        with:
          name: v23-yolo26-cpu-finetune-smoke
          path: |
            reports/v2_3_yolo26n_cpu_finetune_POS_2326530.jpg
            reports/v2_3_yolo26n_cpu_finetune_status.json
            runs/v2_3_yolo26n_cpu_smoke/weights/*.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
