name: v3.3 Pretrained YOLO26 Crossarm Specialist

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "One-class crossarm specialist epochs"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: v33-crossarm-specialist-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  crossarm-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate development sources only
        run: python scripts/v23_download_frozen_images.py
      - name: Validate current 5 train / 1 val / 1 development contract
        run: python scripts/v23_validate_pack.py
      - name: Verify frozen final holdout remains untouched
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test ! -e data/images/test/POS_3437435.jpg
          test ! -e data/images/test/POS_7561805.jpg
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download official pretrained YOLO26n and YOLOE-26n-seg checkpoints
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO, YOLOE
          import shutil
          for name, cls in [('yolo26n.pt', YOLO), ('yoloe-26n-seg.pt', YOLOE)]:
              m=cls(name); del m
              src=Path(name)
              if not src.exists(): raise SystemExit(f'missing {name}')
              shutil.copy2(src,Path('weights')/name)
          PY
          sha256sum weights/*.pt
      - name: Train one-class crossarm specialist and select operating point on validation only
        env:
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '80' }}
        run: python scripts/v33_one_class_specialist.py --class-id 1 --epochs "$EPOCHS" --imgsz 960
      - uses: actions/upload-artifact@v4
        with:
          name: v33-yolo26-crossarm-specialist
          path: |
            reports/v3_3_crossarm_dev_roi.jpg
            reports/v3_3_crossarm_specialist_POS_2326530.jpg
            reports/v3_3_crossarm_specialist_metrics.json
            runs/v3_3_yolo26n_crossarm_specialist/results.csv
            runs/v3_3_yolo26n_crossarm_specialist/weights/*.pt
            weights/yolo26n.pt
            weights/yoloe-26n-seg.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
