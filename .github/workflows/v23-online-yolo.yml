name: v2.7 Source-Diversity YOLO26 Component Ablation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Controlled source-diversity ablation epochs"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: v27-source-diversity-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  five-source-component-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate seven UK tower sources through Geograph direct derivatives
        run: python scripts/v23_download_frozen_images.py
      - name: Validate fixed 5 train / 1 val / 1 test and 77-box contract
        run: python scripts/v23_validate_pack.py
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download official pretrained YOLO26n and YOLOE-26n-seg checkpoints
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO, YOLOE
          import shutil
          for name, cls in [('yolo26n.pt', YOLO), ('yoloe-26n-seg.pt', YOLOE)]:
              m=cls(name); del m
              src=Path(name)
              if not src.exists(): raise SystemExit(f'Ultralytics did not materialize {name}')
              shutil.copy2(src, Path('weights')/name)
          PY
          sha256sum weights/*.pt
      - name: Re-run same tower-crop YOLO26 family with 5 independent training towers
        env:
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '80' }}
        run: python scripts/v27_source_diversity_detector.py --epochs "$EPOCHS"
      - uses: actions/upload-artifact@v4
        with:
          name: v27-source-diversity-component-ablation
          path: |
            reports/v2_3_frozen_image_download.json
            reports/v2_7_pack_validation.json
            reports/v2_7_source_diversity_POS_2326530.jpg
            reports/v2_7_source_diversity_metrics.json
            data/v27_component_crop/data.yaml
            runs/v2_7_yolo26n_component_crop_5sources/results.csv
            runs/v2_7_yolo26n_component_crop_5sources/weights/*.pt
            weights/yolo26n.pt
            weights/yoloe-26n-seg.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
