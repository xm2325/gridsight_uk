name: v4.11 Primary 16-image Gallery and Pinned SigLIP2 Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v411-primary-gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  pages-evidence-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Preserve retired detection holdouts and material evidence semantics
        shell: bash
        run: |
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          test -f configs/v46_siglip2_material_crop_protocol.json
          test -f data/v4_annotations/material_reference_v44.json
          test -f data/final_holdout/final_holdout_freeze.json
          test -f data/v4_holdout/detection_holdout_freeze_v44.json
          grep -q 'adaptive development only' configs/v46_siglip2_material_crop_protocol.json
          if grep -RE "python[[:space:]].*v38_final_holdout.*\.py" .github/workflows; then
            echo 'ERROR: retired v3.8 holdout evaluator reachable.' >&2
            exit 1
          fi
      - name: Install pinned CPU PyTorch and SigLIP2 runtime
        shell: bash
        run: |
          python -m pip install 'torch==2.13.0+cpu' 'torchvision==0.28.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.6' 'sentencepiece==0.2.2' 'safetensors==0.8.0' 'Pillow==12.3.0'
          python - <<'PY'
          import PIL, torch, transformers
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          print('Pillow', PIL.__version__)
          assert torch.__version__ == '2.13.0+cpu'
          assert transformers.__version__ == '4.57.6'
          assert PIL.__version__ == '12.3.0'
          PY
      - name: Hydrate all repository source-image families
        shell: bash
        run: |
          python scripts/v23_download_frozen_images.py
          python scripts/v29_acquire_unseen_candidates.py
          python scripts/v44_acquire_angle_material_candidates.py
      - name: Verify source counts and exact v4.4 material hashes
        shell: bash
        run: |
          test "$(find data/images -type f -name 'POS_*.jpg' | wc -l)" -eq 7
          test "$(find reports/v2_9_unseen_candidates -type f -name 'POS_*.jpg' | wc -l)" -eq 6
          test "$(find reports/v4_4_angle_material_candidates -type f -name 'POS_*.jpg' | wc -l)" -eq 3
          echo '630191b16e8709ad040e80304df072318e6863216cc3f6394a20d553949dd3c2  reports/v4_4_angle_material_candidates/POS_8090535.jpg' | sha256sum -c -
          echo '691c33cbd32767f0055219e2827fd5f6e788aef709d869eb325269e23af20f23  reports/v4_4_angle_material_candidates/POS_2952166.jpg' | sha256sum -c -
      - name: Run frozen SigLIP2 NaFlex material methods
        run: python scripts/v46_siglip2_material_crops.py
      - name: Build offline self-contained evidence showcase
        run: python scripts/v46_build_self_contained_showcase.py
      - name: Verify self-contained showcase
        shell: bash
        run: |
          test -s reports/GridSight_UK_v46_SELF_CONTAINED_SHOWCASE.html
          grep -q 'data:image/jpeg;base64,' reports/GridSight_UK_v46_SELF_CONTAINED_SHOWCASE.html
          if grep -Eq '<script[^>]+src=|<link[^>]+href=|src="https?://' reports/GridSight_UK_v46_SELF_CONTAINED_SHOWCASE.html; then
            echo 'ERROR: external asset dependency found in showcase HTML.' >&2
            exit 1
          fi
      - name: Build multi-image Pages preview
        run: python scripts/v46_build_pages_site.py
      - name: Add all 16 source images and provenance
        run: python scripts/v48_build_full_dataset_gallery.py
      - name: Add all 16 dataset-to-decision case studies
        run: python scripts/v49_build_case_study_explorer.py
      - name: Promote all 16 sources to the primary gallery
        run: python scripts/v50_promote_full_gallery.py
      - name: Verify pinned v4.11 Pages candidate
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/offline.html
          test -s _site/assets/dataset/cases.json
          grep -q 'Full source gallery · all 16 images' _site/index.html
          grep -q 'Gallery · 16' _site/index.html
          grep -q 'All 16 project source images' _site/index.html
          grep -q 'Data provenance contract' _site/index.html
          grep -q 'Case-study explorer' _site/index.html
          grep -q 'POS_2326530' _site/index.html
          grep -q 'POS_3437435' _site/index.html
          grep -q 'POS_7630781' _site/index.html
          grep -q 'unspent frozen holdout' _site/index.html
          grep -q 'v4.11-primary-16-gallery' _site/index.html
          grep -q "getElementById('modal-img')" _site/index.html
          if grep -q 'Three source images, three tower configurations' _site/index.html; then
            echo 'ERROR: old three-image gallery is still present.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site/index.html')
          text=p.read_text()
          if p.stat().st_size > 420_000:
              raise SystemExit(f'Online index too large: {p.stat().st_size}')
          detail=sorted(Path('_site/assets').glob('POS_*_detail_*.webp'))
          full=sorted(Path('_site/assets/dataset/full').glob('POS_*.jpg'))
          thumbs=sorted(Path('_site/assets/dataset/thumbs').glob('POS_*.webp'))
          manifest=json.loads(Path('_site/assets/dataset/manifest.json').read_text())
          cases=json.loads(Path('_site/assets/dataset/cases.json').read_text())
          material=json.loads(Path('reports/v4_6_siglip2_material_crop_results.json').read_text())
          if len(detail) != 12:
              raise SystemExit(f'Expected 12 detail crops, found {len(detail)}')
          if len(full) != 16 or len(thumbs) != 16:
              raise SystemExit(f'Expected 16 full + 16 thumbs, found {len(full)} + {len(thumbs)}')
          if manifest['unique_source_images'] != 16 or cases['case_count'] != 16:
              raise SystemExit('Manifest/case source count mismatch')
          if text.count('class="dataset-card"') != 16:
              raise SystemExit('Expected 16 cards in the primary Gallery section')
          if text.count('<section id="gallery"') != 1 or '<section id="dataset">' in text:
              raise SystemExit('Expected one promoted Gallery section and no separate Dataset section')
          if text.count('class="case-open"') != 16:
              raise SystemExit('Expected 16 gallery case-study buttons')
          if text.count('v4.11-primary-16-gallery') != 2:
              raise SystemExit('Expected v4.11 build marker in meta and footer')
          if cases['cases']['POS_7630781']['metrics'][-1]['value'] != 'NOT RUN':
              raise SystemExit('POS_7630781 must remain an unspent holdout')
          order=[
              'siglip2_text_prompt_prototype',
              'siglip2_image_reference_prototype',
              'siglip2_equal_weight_text_image_hybrid',
          ]
          expected=[f"{round(material['methods'][k]['accuracy']*6)}/6" for k in order]
          shown=[x['value'] for x in cases['cases']['POS_2952166']['metrics'][:3]]
          if shown != expected:
              raise SystemExit(f'Material case-study metrics do not match this CI run: shown={shown}, expected={expected}')
          print(f'Online index: {p.stat().st_size:,} bytes')
          print('Build marker: v4.11-primary-16-gallery')
          print('Primary gallery cards: 16/16')
          print(f'Legacy verified Commons originals: {manifest["legacy_verified_commons_originals"]}/7')
          print(f'Case studies: {cases["case_count"]}; featured: {len(cases["featured"])}')
          print(f'Material case metrics from this pinned run: {shown}')
          print(f'Dataset thumbs: {len(thumbs)} / {sum(x.stat().st_size for x in thumbs):,} bytes')
          print(f'Dataset full: {len(full)} / {sum(x.stat().st_size for x in full):,} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v411-pinned-primary-16-image-gallery-preview
          path: |
            reports/v4_6_siglip2_material_crop_results.json
            reports/GridSight_UK_v46_SELF_CONTAINED_SHOWCASE.html
            _site/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
