name: v3.7 Symmetry-Pair YOLOE Insulator Completion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v37-symmetry-pair-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  symmetry-pair-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate development sources only
        run: python scripts/v23_download_frozen_images.py
      - name: Validate current 5 train / 1 val / 1 development contract
        run: python scripts/v23_validate_pack.py
      - name: Verify frozen final holdout remains untouched
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test ! -e data/images/test/POS_3437435.jpg
          test ! -e data/images/test/POS_7561805.jpg
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics and text-prompt dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-yolo.txt
          python -m pip install 'git+https://github.com/ultralytics/CLIP.git'
      - name: Download official YOLOE-26n-seg checkpoint
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLOE
          import shutil
          name='yoloe-26n-seg.pt'
          m=YOLOE(name); del m
          src=Path(name)
          if not src.exists(): raise SystemExit(f'missing {name}')
          shutil.copy2(src,Path('weights')/name)
          PY
          sha256sum weights/yoloe-26n-seg.pt
      - name: Fit training-only symmetry prior and complete high-precision YOLOE pairs
        run: python scripts/v37_symmetry_pair_completion.py
      - uses: actions/upload-artifact@v4
        with:
          name: v37-yoloe-symmetry-pair
          path: |
            reports/v3_7_symmetry_pair_metrics.json
            reports/v3_5_v37_val_POS_5442616_tower_roi.jpg
            reports/v3_5_v37_dev_POS_2326530_tower_roi.jpg
            reports/v3_5_v37_precision_seeds_POS_2326530.jpg
            reports/v3_5_v37_symmetry_completed_POS_2326530.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
