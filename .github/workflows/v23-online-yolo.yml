name: v2.9 Acquire Unseen UK Tower Candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v29-unseen-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-unseen-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download six geographically diverse unseen Geograph tower candidates
        run: python scripts/v29_acquire_unseen_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: v29-unseen-candidate-images
          path: |
            reports/v2_9_unseen_candidates/*.jpg
            reports/v2_9_unseen_candidate_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
