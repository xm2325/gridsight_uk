name: v3.9 Post-Final Generalization Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-post-final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit-only dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Verify final-holdout contracts and persisted one-shot evidence
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test -f data/final_holdout/champion_freeze_v38.json
          test -f reports/v3_8_final_holdout_summary.json
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          grep -q '"headline_claim_ready": false' reports/v3_8_final_holdout_summary.json
      - name: Enforce no automatic final-holdout inference after v3.8
        shell: bash
        run: |
          if grep -R "python scripts/v38_final_holdout_eval.py" .github/workflows; then
            echo 'ERROR: post-final workflows must not automatically re-run the frozen holdout evaluator.' >&2
            exit 1
          fi
      - name: Run label-only morphology-shift audit
        run: python scripts/v39_post_final_morphology_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v39-post-final-generalization-audit
          path: |
            reports/v3_8_final_holdout_summary.json
            reports/v3_9_morphology_shift.json
            reports/v3_9_morphology_shift.md
          if-no-files-found: error
          retention-days: 90
