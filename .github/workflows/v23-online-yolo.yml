name: v4.4 Angle and Material Candidate Acquisition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v44-angle-material-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-before-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve retired v3.8 holdout lock
        shell: bash
        run: |
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          if grep -RE "python[[:space:]].*v38_final_holdout.*\.py" .github/workflows; then
            echo 'ERROR: retired holdout evaluator reachable from v4 workflow.' >&2
            exit 1
          fi
      - name: Install image audit dependency only
        run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire pre-inference angle, terminal and material-context candidates
        run: python scripts/v44_acquire_angle_material_candidates.py
      - name: Verify candidate-only boundary
        shell: bash
        run: |
          grep -q '"count": 3' reports/v4_4_angle_material_candidate_manifest.json
          grep -q '"model_inference_performed": false' reports/v4_4_angle_material_candidate_manifest.json
          grep -q '"material_ground_truth_status": "none; page-level descriptive context only"' reports/v4_4_angle_material_candidate_manifest.json
          test -f reports/v4_4_angle_material_contact_sheet.jpg
          ! grep -q 'POS_3437435' reports/v4_4_angle_material_candidate_manifest.json
          ! grep -q 'POS_7561805' reports/v4_4_angle_material_candidate_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: v44-angle-material-candidates
          path: |
            reports/v4_4_angle_material_candidate_manifest.json
            reports/v4_4_angle_material_contact_sheet.jpg
            reports/v4_4_angle_material_candidates/*.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
