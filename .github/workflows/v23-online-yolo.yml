name: v3.4 Tiled YOLO26 Insulator Scale Ablation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Tiled one-class insulator specialist epochs"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: v34-tiled-insulator-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tiled-insulator-scale-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate development sources only
        run: python scripts/v23_download_frozen_images.py
      - name: Validate current 5 train / 1 val / 1 development contract
        run: python scripts/v23_validate_pack.py
      - name: Verify frozen final holdout remains untouched
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test ! -e data/images/test/POS_3437435.jpg
          test ! -e data/images/test/POS_7561805.jpg
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download official pretrained YOLO26n and YOLOE-26n-seg checkpoints
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO, YOLOE
          import shutil
          for name, cls in [('yolo26n.pt', YOLO), ('yoloe-26n-seg.pt', YOLOE)]:
              m=cls(name); del m
              src=Path(name)
              if not src.exists(): raise SystemExit(f'missing {name}')
              shutil.copy2(src,Path('weights')/name)
          PY
          sha256sum weights/*.pt
      - name: Train supervised 2x2 tiled insulator detector and select operating point on validation only
        env:
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '80' }}
        run: python scripts/v34_tiled_insulator_specialist.py --epochs "$EPOCHS"
      - uses: actions/upload-artifact@v4
        with:
          name: v34-tiled-yolo26-insulator-specialist
          path: |
            reports/v3_4_dev_parent_crop.jpg
            reports/v3_4_tiled_insulator_POS_2326530.jpg
            reports/v3_4_tiled_insulator_metrics.json
            runs/v3_4_yolo26n_tiled_insulator/results.csv
            runs/v3_4_yolo26n_tiled_insulator/weights/*.pt
            weights/yolo26n.pt
            weights/yoloe-26n-seg.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
