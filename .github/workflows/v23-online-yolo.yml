name: v2.3 Online YOLOE-26 Fast Showcase

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v23-fast-showcase-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  yoloe-fast-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Download fixed held-out image from Geograph direct host
        run: python scripts/v23_download_showcase.py
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download YOLOE-26n-seg checkpoint into frozen weights directory
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLOE
          import shutil
          m=YOLOE('yoloe-26n-seg.pt')
          del m
          src=Path('yoloe-26n-seg.pt')
          if not src.exists():
              raise SystemExit('Ultralytics did not materialize yoloe-26n-seg.pt')
          shutil.copy2(src, Path('weights')/src.name)
          PY
          sha256sum weights/yoloe-26n-seg.pt
      - name: Run genuine YOLOE-26 zero-shot text-prompt segmentation
        run: python scripts/v23_yoloe_zero_shot.py
      - uses: actions/upload-artifact@v4
        with:
          name: v23-yoloe-fast-showcase
          path: |
            data/images/test/POS_2326530.jpg
            reports/v2_3_showcase_image_download.json
            reports/v2_3_yoloe26_zero_shot_POS_2326530.jpg
            reports/v2_3_yoloe26_zero_shot_predictions.json
            weights/yoloe-26n-seg.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
