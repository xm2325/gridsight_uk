name: v4.0 Morphology-Diverse Candidate Acquisition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v40-morphology-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify old final holdout stays retired
        shell: bash
        run: |
          test -f reports/v3_8_final_holdout_summary.json
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          needle="v38_final_holdout_"'eval.py'
          if grep -R "$needle" .github/workflows; then exit 1; fi
      - name: Acquire 10 new model-unseen morphology candidates
        run: python scripts/v40_acquire_morphology_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: v40-morphology-candidates
          path: |
            reports/v4_0_candidate_manifest.json
            reports/v4_0_candidates/*.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
