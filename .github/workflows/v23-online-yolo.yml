name: v2.6 Validation-Tuned YOLOE + YOLO26 Hybrid

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v26-val-tuned-hybrid-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  V25_RUN_ID: "32087749320"

jobs:
  validation-tuned-operating-point:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate fixed validation and test imagery from Geograph
        run: python scripts/v23_download_frozen_images.py
      - name: Validate source-isolated split and 55-box contract
        run: python scripts/v23_validate_pack.py
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download frozen v2.5 trained model artifact from prior successful run
        uses: actions/download-artifact@v4
        with:
          name: v25-yoloe-yolo26-component-hybrid
          path: prior-v25
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.V25_RUN_ID }}
      - name: Select confidence/NMS only on validation tower, then evaluate fixed held-out test
        run: python scripts/v26_val_tuned_postprocess.py --artifact-root prior-v25
      - uses: actions/upload-artifact@v4
        with:
          name: v26-validation-tuned-hybrid
          path: |
            reports/v2_3_frozen_image_download.json
            reports/v2_3_pack_validation.json
            reports/v2_6_val_crop_POS_5442616.jpg
            reports/v2_6_test_yoloe_crop_POS_2326530.jpg
            reports/v2_6_val_tuned_hybrid_POS_2326530.jpg
            reports/v2_6_val_tuned_hybrid_metrics.json
          if-no-files-found: error
          retention-days: 30
