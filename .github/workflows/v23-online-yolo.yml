name: v4.6 SigLIP2 Material Crop Classification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v46-siglip2-material-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  siglip2-material-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve retired detection holdouts and material evidence semantics
        shell: bash
        run: |
          grep -q '"no_further_tuning_permitted": true' reports/v3_8_final_holdout_summary.json
          test -f configs/v46_siglip2_material_crop_protocol.json
          test -f data/v4_annotations/material_reference_v44.json
          grep -q 'adaptive development only' configs/v46_siglip2_material_crop_protocol.json
          if grep -RE "python[[:space:]].*v38_final_holdout.*\.py" .github/workflows; then
            echo 'ERROR: retired v3.8 holdout evaluator reachable.' >&2
            exit 1
          fi
      - name: Install CPU PyTorch and SigLIP2 runtime
        shell: bash
        run: |
          python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.49,<5' 'sentencepiece>=0.2' 'safetensors>=0.4' 'Pillow>=10,<13'
      - name: Re-acquire frozen material reference/development pixels
        run: python scripts/v44_acquire_angle_material_candidates.py
      - name: Verify exact reference and adaptive-development source hashes
        shell: bash
        run: |
          echo '630191b16e8709ad040e80304df072318e6863216cc3f6394a20d553949dd3c2  reports/v4_4_angle_material_candidates/POS_8090535.jpg' | sha256sum -c -
          echo '691c33cbd32767f0055219e2827fd5f6e788aef709d869eb325269e23af20f23  reports/v4_4_angle_material_candidates/POS_2952166.jpg' | sha256sum -c -
      - name: Run frozen SigLIP2 NaFlex text, image-prototype and hybrid crop methods
        run: python scripts/v46_siglip2_material_crops.py
      - uses: actions/upload-artifact@v4
        with:
          name: v46-siglip2-material-crops
          path: |
            reports/v4_6_siglip2_material_crop_results.json
            reports/v4_6_siglip2_text_prompt_prototype_POS_2952166.jpg
            reports/v4_6_siglip2_image_reference_prototype_POS_2952166.jpg
            reports/v4_6_siglip2_equal_weight_text_image_hybrid_POS_2952166.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
