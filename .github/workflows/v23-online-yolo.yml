name: v2.5 YOLOE ROI + Pretrained YOLO26 Component Hybrid

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Exploratory YOLO26n component-crop fine-tune epochs"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: v25-yoloe-yolo26-hybrid-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  hybrid-component-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-yolo.txt
      - name: Hydrate five UK tower images through Geograph direct derivatives
        run: python scripts/v23_download_frozen_images.py
      - name: Validate fixed 3 train / 1 val / 1 test and 55 boxes
        run: python scripts/v23_validate_pack.py
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ultralytics stack
        run: python -m pip install -r requirements-yolo.txt
      - name: Download official pretrained YOLO26n and YOLOE-26n-seg checkpoints
        shell: bash
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO, YOLOE
          import shutil
          for name, cls in [('yolo26n.pt', YOLO), ('yoloe-26n-seg.pt', YOLOE)]:
              m=cls(name); del m
              src=Path(name)
              if not src.exists(): raise SystemExit(f'Ultralytics did not materialize {name}')
              shutil.copy2(src, Path('weights')/name)
          PY
          sha256sum weights/*.pt
      - name: Train tower-crop component detector; held-out ROI is YOLOE-generated
        env:
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '80' }}
        run: python scripts/v25_hybrid_component_detector.py --epochs "$EPOCHS"
      - uses: actions/upload-artifact@v4
        with:
          name: v25-yoloe-yolo26-component-hybrid
          path: |
            reports/v2_3_frozen_image_download.json
            reports/v2_3_pack_validation.json
            reports/v2_5_yoloe_yolo26_hybrid_POS_2326530.jpg
            reports/v2_5_yoloe_yolo26_hybrid_metrics.json
            data/v25_component_crop/data.yaml
            runs/v2_5_yolo26n_component_crop/results.csv
            runs/v2_5_yolo26n_component_crop/weights/*.pt
            weights/yolo26n.pt
            weights/yoloe-26n-seg.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
