name: v3.9 Post-Final Holdout Evidence Lock

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v39-post-final-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-final-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify final-holdout contracts remain frozen
        shell: bash
        run: |
          test -f data/final_holdout/final_holdout_freeze.json
          test -f data/final_holdout/champion_freeze_v38.json
          grep -q '"frozen_before_final_holdout_inference": true' data/final_holdout/champion_freeze_v38.json
          grep -q '"post_evaluation_rule"' data/final_holdout/champion_freeze_v38.json
      - name: Enforce no automatic final-holdout inference after v3.8
        shell: bash
        run: |
          if grep -R "v38_final_holdout_eval.py" .github/workflows; then
            echo 'ERROR: post-final workflows must not automatically re-run the frozen holdout evaluator.' >&2
            exit 1
          fi
          echo 'Final holdout is locked. Further commits may analyze frozen results but may not tune or re-run them as final evidence.'
